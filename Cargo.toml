[workspace]
resolver = "3"
members = ["crates/hblctl", "crates/hblctl-core", "crates/hblctl-ffi", "crates/hblctl-mods", "crates/hblctl-proto", "crates/hblctl-transport"]

[workspace.package]
edition = "2024"
license = "LGPL-3.0-or-later"
version = "0.2.0"
repository = "https://github.com/xerootg/hblctl"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
