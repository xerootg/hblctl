# cargo-deny: licences, advisories, duplicate crates and sources.
# Inbound dependency licences must be compatible with distributing hblctl under LGPL-3.0-or-later
# without changing that licence. GPL-only dependencies are rejected because they would force the
# combined work to GPL and remove the option to relicense.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # basic-toml is unmaintained (not vulnerable). It is reached only through uniffi_bindgen -> askama_derive,
  # the Kotlin binding generator used at build time; it never runs on a camera or in the shipped app.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen/askama; no maintained alternative yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "LGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
