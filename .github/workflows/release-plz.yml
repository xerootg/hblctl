# Versioning and releases are driven by Conventional Commits:
# release-plz keeps a "release" PR open with the next semver bump and changelog entries;
# merging it tags the release and creates the GitHub release.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: release PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: release
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: rp
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # `releases` lists every workspace package; only the hblctl package has a git tag and release.
      - id: tag
        run: echo "tag=$(jq -r '.[] | select(.package_name == "hblctl") | .tag // empty' <<< "$RELEASES")" >> "$GITHUB_OUTPUT"
        env:
          RELEASES: ${{ steps.rp.outputs.releases || '[]' }}

  # Releases made with GITHUB_TOKEN do not trigger other workflows, so the APK job is called directly.
  apk:
    name: release APK
    needs: release
    if: needs.release.outputs.releases_created == 'true' && needs.release.outputs.tag != ''
    uses: ./.github/workflows/android-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
