name: Android release APK and AAR
# Runs after release-plz creates a release (workflow_call), for releases published by hand
# (release event), or on demand for an existing tag (workflow_dispatch). A release made with the
# built-in GITHUB_TOKEN does not fire the release event, which is why release-plz calls this directly.
# From v0.4.0 on it also builds the hblctl-ffi AAR, attaches it to the release and publishes it to
# GitHub Packages as org.hblctl:hblctl-ffi (see android/README.md for consumers).
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the APK (and, from v0.4.0, the AAR) to, e.g. v0.4.0
        required: true
        type: string
permissions:
  contents: write
  packages: write
jobs:
  android-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      # Optimised native libraries for both the APK and the AAR.
      HBLCTL_RUST_PROFILE: release
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the tagged commit, not main: a dispatched run for an old tag must reproduce that release.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The ubuntu runner ships an Android SDK at $ANDROID_HOME; accept licences and add what the app needs.
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      # Gradle version comes from android/gradle/wrapper (pinned to 9.0.0; AGP 8.13 needs <= 9.5).
      - uses: gradle/actions/setup-gradle@v6
      - run: cargo install cargo-ndk --locked
      - run: cargo fetch --locked
      # Signed with the project's release key so Obtainium and manual installs update in place across versions.
      - run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "APK_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_SRC=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_NAME=hblctl-${RELEASE_TAG}.apk" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set: uploading a debug-signed APK; it will not update in place"
            echo "APK_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK_SRC=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_NAME=hblctl-${RELEASE_TAG}-debug-unsigned.apk" >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      # Tags before v0.4.0 have no library module; for those only the APK is rebuilt.
      - run: |
          if [ -f android/lib/build.gradle.kts ]; then
            echo "HAS_AAR=true" >> "$GITHUB_ENV"
            echo "LIB_TASKS=:lib:publishReleasePublicationToLocalRepository" >> "$GITHUB_ENV"
          else
            echo "HAS_AAR=false" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew --no-daemon :app:testDebugUnitTest ":app:$APK_TASK" $LIB_TASKS
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # The AAR is checked the way the companion app will use it before anything is published.
      - if: env.HAS_AAR == 'true'
        run: ./gradlew --no-daemon -p consumer-smoke testDebugUnitTest "-PhblctlVersion=${RELEASE_TAG#v}"
        working-directory: android
      - run: cp "$APK_SRC" "$APK_NAME"
      - run: gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.HAS_AAR == 'true'
        run: |
          version="${RELEASE_TAG#v}"
          aar="android/lib/build/repo/org/hblctl/hblctl-ffi/$version/hblctl-ffi-$version.aar"
          if [ ! -f "$aar" ]; then
            echo "::error::$aar not found: Cargo.toml's workspace version does not match the tag $RELEASE_TAG"
            exit 1
          fi
          cp "$aar" "hblctl-ffi-$RELEASE_TAG.aar"
          gh release upload "$RELEASE_TAG" "hblctl-ffi-$RELEASE_TAG.aar" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # GitHub Packages versions are immutable, so a re-run for a tag that is already published skips this.
      - if: env.HAS_AAR == 'true'
        run: |
          version="${RELEASE_TAG#v}"
          pom="https://maven.pkg.github.com/${GITHUB_REPOSITORY}/org/hblctl/hblctl-ffi/$version/hblctl-ffi-$version.pom"
          status=$(curl -s -o /dev/null -w '%{http_code}' -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$pom")
          if [ "$status" = 200 ]; then
            echo "::notice::org.hblctl:hblctl-ffi:$version is already on GitHub Packages; not republishing"
          else
            ./gradlew --no-daemon :lib:publishReleasePublicationToGitHubPackagesRepository
          fi
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ github.token }}
