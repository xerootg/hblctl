name: Android release APK
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The ubuntu runner ships an Android SDK at $ANDROID_HOME; accept licences and add what the app needs.
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      # Gradle version comes from android/gradle/wrapper (pinned to 9.0.0; AGP 8.13 needs <= 9.5).
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo install cargo-ndk --locked
      - run: cargo fetch --locked
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      - run: gh release upload "$RELEASE_TAG" android/app/build/outputs/apk/debug/app-debug.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
