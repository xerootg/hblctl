[package]
name = "hblctl"
description = "CLI, TUI and MCP server for the Hasselblad X-system factory diagnostic protocol."
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
hblctl-proto = { path = "../hblctl-proto", version = "0.1.0" }
hblctl-transport = { path = "../hblctl-transport", version = "0.1.0" }
hblctl-core = { path = "../hblctl-core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
dirs = "6"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

[dev-dependencies]
tempfile = "3"
