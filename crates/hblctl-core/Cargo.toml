[package]
name = "hblctl-core"
description = "hblctl client: request/result matching, safety policy, command registry and dispatcher shared by the CLI, TUI and MCP frontends."
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
hblctl-proto = { path = "../hblctl-proto", version = "0.3.0" }
hblctl-transport = { path = "../hblctl-transport", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"

[dev-dependencies]
hblctl-proto = { path = "../hblctl-proto", version = "0.2.0" }
tokio = { version = "1", features = ["time", "rt", "macros"] }
