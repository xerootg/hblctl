[package]
name = "hblctl-ffi"
description = "UniFFI bindings to the hblctl core for the Android app."
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "hblctl_ffi"

[lints]
workspace = true

[dependencies]
hblctl-core = { path = "../hblctl-core", version = "0.1.0" }
hblctl-transport = { path = "../hblctl-transport", version = "0.1.0" }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
uniffi = { version = "0.29", default-features = false }

[dev-dependencies]
hblctl-proto = { path = "../hblctl-proto", version = "0.1.0" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[features]
cli = ["uniffi/cli"]

[[bin]]
name = "hblctl-bindgen"
path = "src/bindgen.rs"
required-features = ["cli"]
